---
# Variables partagées par tous les rôles.
# Le durcissement (sshd, fail2ban, unattended-upgrades) est appliqué directement
# dans site.yml ; pas de variable dédiée nécessaire ici.

# --- Istio (service mesh, v2) ---
# Remplace SPIRE : le mTLS, l'identité et l'autorisation sont désormais portés
# par le mesh. La v1 (SPIRE + mTLS câblé à la main) reste consultable sur le
# tag/branche v1-manual-mtls.
istio_namespace: "istio-system"
istio_chart_version: "1.24.1"
istio_helm_repo: "https://istio-release.storage.googleapis.com/charts"

# --- Kiali (dashboard du mesh) ---
kiali_chart_version: "1.89.0"
kiali_helm_repo: "https://kiali.org/helm-charts"

# Dashboards Grafana officiels d'Istio (grafana.com). Importés par le rôle
# observability via le sidecar dashboards de Grafana. id = ID grafana.com,
# rev = révision compatible Istio 1.24.
istio_grafana_dashboards:
  - { name: "mesh", id: 7639, rev: 192 }
  - { name: "service", id: 7636, rev: 192 }
  - { name: "workload", id: 7630, rev: 192 }
  - { name: "control-plane", id: 7645, rev: 192 }
  - { name: "performance", id: 11829, rev: 192 }

# --- ArgoCD ---
argocd_namespace: "argocd"
argocd_chart_version: "7.7.7"
argocd_helm_repo: "https://argoproj.github.io/argo-helm"

# Dépôt Git surveillé par ArgoCD : la branche deploy/prod contient l'état
# déployé (images taggées par SHA, mises à jour par la CI). Jamais main.
gitops_repo_url: "https://github.com/Sipixer/SPIRE-DevSecOps.git"
gitops_repo_revision: "deploy/prod"
gitops_repo_path: "k8s/workloads"

# --- Apps (namespace métier) ---
shop_namespace: "shop"

# --- Observabilité (Prometheus + Grafana) ---
monitoring_namespace: "monitoring"
kube_prometheus_stack_chart_version: "65.5.1"
prometheus_helm_repo: "https://prometheus-community.github.io/helm-charts"
# Host Traefik qui sert Grafana (catch-all : on passe par un Host dédié car
# l'ingress Gateway capte déjà "/" sans host). Adapter au domaine du VPS.
grafana_host: "grafana.localhost"
grafana_admin_user: "admin"
grafana_admin_password: "admin"
# v2 : les métriques applicatives (RPS, latence, codes, mTLS) sont produites par
# les sidecars Istio et scrappées via les annotations Prometheus standard du
# mesh — plus de port /metrics maison (9100) ni de liste de services à scraper.
