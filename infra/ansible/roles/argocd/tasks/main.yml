---
- name: Repo Helm Argo
  ansible.builtin.command: helm repo add argo {{ argocd_helm_repo }} --force-update
  changed_when: false
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }

- name: helm repo update
  ansible.builtin.command: helm repo update argo
  changed_when: false
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }

# argocd-server en mode insecure : le TLS est terminé par Cloudflare en amont.
# Sans ça, ArgoCD redirige HTTP->HTTPS et provoque une boucle (ERR_TOO_MANY_REDIRECTS)
# derrière le tunnel. La clé Helm "server.insecure" contient un point littéral :
# on passe par un fichier values pour éviter tout problème d'échappement.
- name: Values ArgoCD (insecure derrière le tunnel)
  ansible.builtin.copy:
    dest: /tmp/argocd-values.yaml
    content: |
      configs:
        params:
          server.insecure: true
    mode: "0644"

- name: Installer ArgoCD
  ansible.builtin.command: >-
    helm upgrade --install argocd argo/argo-cd
    --version {{ argocd_chart_version }}
    --namespace {{ argocd_namespace }} --create-namespace
    --values /tmp/argocd-values.yaml
    --wait --timeout 5m
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: true

- name: Application ArgoCD (surveille k8s/ sur main)
  ansible.builtin.shell:
    cmd: |
      k3s kubectl apply -f - <<'EOF'
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: shop
        namespace: {{ argocd_namespace }}
      spec:
        project: default
        source:
          repoURL: {{ gitops_repo_url }}
          targetRevision: {{ gitops_repo_revision }}
          path: {{ gitops_repo_path }}
        destination:
          server: https://kubernetes.default.svc
          namespace: {{ shop_namespace }}
        syncPolicy:
          automated: { prune: true, selfHeal: true }
          syncOptions: [CreateNamespace=true]
      EOF
  changed_when: true

# --- Accès à l'UI ArgoCD via Cloudflare Tunnel (optionnel) ---
# Activé seulement si cloudflared_tunnel_token est fourni (output Terraform passé
# par la CI). Le token n'est jamais committé : il vit dans un Secret k8s créé ici.
- name: Secret du token de tunnel cloudflared
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ argocd_namespace }} create secret generic cloudflared-token
      --from-literal=token={{ cloudflared_tunnel_token }}
      --dry-run=client -o yaml
  register: cloudflared_secret_yaml
  changed_when: false
  when: cloudflared_tunnel_token | default('') | length > 0

- name: Appliquer le Secret cloudflared
  ansible.builtin.shell:
    cmd: "k3s kubectl apply -f -"
    stdin: "{{ cloudflared_secret_yaml.stdout }}"
  changed_when: true
  when: cloudflared_tunnel_token | default('') | length > 0

- name: Déployer le connecteur cloudflared
  ansible.builtin.shell:
    cmd: "k3s kubectl apply -f -"
    stdin: "{{ lookup('template', 'cloudflared.yaml.j2') }}"
  changed_when: true
  when: cloudflared_tunnel_token | default('') | length > 0
