---
- name: Paquets de base
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Installer k3s
  ansible.builtin.shell:
    cmd: curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
    creates: /usr/local/bin/k3s

- name: Attendre que le nœud soit Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false

- name: Installer Helm
  ansible.builtin.shell:
    cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    creates: /usr/local/bin/helm
