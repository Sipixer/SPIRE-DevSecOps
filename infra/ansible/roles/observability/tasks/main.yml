---
- name: Repo Helm prometheus-community
  ansible.builtin.command: helm repo add prometheus-community {{ prometheus_helm_repo }} --force-update
  changed_when: false
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }

- name: helm repo update
  ansible.builtin.command: helm repo update prometheus-community
  changed_when: false
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }

- name: Values kube-prometheus-stack
  ansible.builtin.template:
    src: kps-values.yaml.j2
    dest: /tmp/kps-values.yaml
    mode: "0644"

- name: Installer kube-prometheus-stack (Prometheus + Grafana)
  ansible.builtin.command: >-
    helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
    --version {{ kube_prometheus_stack_chart_version }}
    --namespace {{ monitoring_namespace }} --create-namespace
    --values /tmp/kps-values.yaml
    --wait --timeout 8m
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  changed_when: true

- name: Rendre le dashboard Grafana
  ansible.builtin.template:
    src: dashboard-spire-zerotrust.json.j2
    dest: /tmp/spire-zerotrust.json
    mode: "0644"

- name: ConfigMap du dashboard SPIRE / Zero-trust
  ansible.builtin.shell:
    cmd: |
      k3s kubectl create configmap grafana-dashboard-spire \
        --namespace {{ monitoring_namespace }} \
        --from-file=spire-zerotrust.json=/tmp/spire-zerotrust.json \
        --dry-run=client -o yaml | k3s kubectl apply -f -
  changed_when: true

- name: Label grafana_dashboard sur la ConfigMap
  ansible.builtin.command: >-
    k3s kubectl label configmap grafana-dashboard-spire
    --namespace {{ monitoring_namespace }}
    grafana_dashboard=1 --overwrite
  changed_when: true

# --- Dashboards Istio (v2) ---
# Les 6 dashboards officiels Istio (mesh, service, workload, control plane,
# performance, wasm), publiés sur grafana.com. On les télécharge et on les
# expose à Grafana via le sidecar dashboards (label grafana_dashboard), comme
# le dashboard SPIRE. Ils consomment les métriques Istio scrapées par Prometheus.
- name: Télécharger les dashboards Istio depuis grafana.com
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.rev }}/download"
    dest: "/tmp/istio-{{ item.name }}.json"
    mode: "0644"
  loop: "{{ istio_grafana_dashboards }}"

# Le JSON téléchargé contient un placeholder de datasource (${DS_PROMETHEUS}).
# On le remplace par le nom de la datasource Prometheus par défaut du chart
# (« Prometheus ») pour que le dashboard pointe sur la bonne source sans clic.
- name: Adapter la datasource Prometheus dans les dashboards Istio
  ansible.builtin.replace:
    path: "/tmp/istio-{{ item.name }}.json"
    regexp: '\$\{DS_PROMETHEUS\}'
    replace: "Prometheus"
  loop: "{{ istio_grafana_dashboards }}"

- name: ConfigMaps des dashboards Istio
  ansible.builtin.shell:
    cmd: |
      k3s kubectl create configmap grafana-dashboard-istio-{{ item.name }} \
        --namespace {{ monitoring_namespace }} \
        --from-file=istio-{{ item.name }}.json=/tmp/istio-{{ item.name }}.json \
        --dry-run=client -o yaml | k3s kubectl apply -f -
  loop: "{{ istio_grafana_dashboards }}"
  changed_when: true

- name: Label grafana_dashboard sur les ConfigMaps Istio
  ansible.builtin.command: >-
    k3s kubectl label configmap grafana-dashboard-istio-{{ item.name }}
    --namespace {{ monitoring_namespace }}
    grafana_dashboard=1 --overwrite
  loop: "{{ istio_grafana_dashboards }}"
  changed_when: true
