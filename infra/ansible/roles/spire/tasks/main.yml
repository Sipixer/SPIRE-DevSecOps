---
# Déploie SPIRE (Server + Agent) via le chart Helm hardened.
# Reprend la logique de l'ancien module Terraform, côté serveur.

- name: Ajouter le repo Helm SPIFFE
  kubernetes.core.helm_repository:
    name: spiffe
    repo_url: "{{ spire_helm_repo }}"

- name: Créer le namespace SPIRE (privileged pour le CSI driver)
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ spire_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: privileged

- name: Installer les CRDs SPIRE
  kubernetes.core.helm:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: spire-crds
    chart_ref: spiffe/spire-crds
    chart_version: "{{ spire_crds_chart_version }}"
    release_namespace: "{{ spire_namespace }}"

- name: Rendre les values SPIRE
  ansible.builtin.template:
    src: spire-values.yaml.j2
    dest: /tmp/spire-values.yaml
    mode: "0644"

- name: Installer le chart SPIRE (Server + Agent)
  kubernetes.core.helm:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: spire
    chart_ref: spiffe/spire
    chart_version: "{{ spire_chart_version }}"
    release_namespace: "{{ spire_namespace }}"
    values_files:
      - /tmp/spire-values.yaml
    wait: true
    timeout: 5m0s
