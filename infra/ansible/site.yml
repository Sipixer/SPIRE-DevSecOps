---
- name: Configurer le serveur k3s
  hosts: all
  become: true
  pre_tasks:
    # Durcissement du socle avant toute installation. Défense en profondeur :
    #   - fail2ban : bannit les IP qui tentent du brute-force SSH (filet de
    #     sécurité si jamais le port 22 est ouvert, ceinture + bretelles) ;
    #   - unattended-upgrades : patchs de sécurité OS appliqués automatiquement
    #     (la plupart des compromissions exploitent des CVE déjà corrigées).
    - name: Installer fail2ban et unattended-upgrades
      ansible.builtin.apt:
        name: [fail2ban, unattended-upgrades]
        state: present
        update_cache: true
      tags: [hardening]

    - name: Activer fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
      tags: [hardening]

    - name: Activer les mises à jour de sécurité automatiques
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      tags: [hardening]

    # Durcissement sshd minimal : authentification par mot de passe coupée
    # (anti-brute-force) et root autorisé PAR CLÉ uniquement — la CI se connecte
    # en root par clé, donc on garde "prohibit-password" et pas "no". Déposé en
    # drop-in pour ne pas réécrire tout sshd_config.
    - name: Durcir sshd (drop-in)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          X11Forwarding no
          MaxAuthTries 3
      notify: Redémarrer sshd
      tags: [hardening]
  handlers:
    - name: Redémarrer sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
  # Ordre des rôles = chaîne de dépendances, important pour un déploiement
  # reproductible from scratch :
  #   1. k3s           : le cluster.
  #   2. observability : Prometheus + Grafana. AVANT istio car Kiali se branche
  #      sur ce Prometheus au démarrage (sinon il boote sans source de métriques).
  #   3. istio         : le service mesh (CRDs + istiod + Kiali). AVANT argocd
  #      car la boutique déployée par ArgoCD a besoin des CRDs Istio
  #      (PeerAuthentication/AuthorizationPolicy) et de l'injection de sidecars.
  #   4. argocd        : déploie la boutique (shop) en GitOps depuis deploy/prod.
  #
  # v2 : Istio remplace SPIRE. Le rôle spire/ est conservé dans le dépôt pour la
  # démo d'évolution (v1) mais n'est plus joué.
  roles:
    - { role: k3s, tags: [k3s] }
    - { role: observability, tags: [observability] }
    - { role: istio, tags: [istio] }
    - { role: argocd, tags: [argocd] }
