---
- name: Configurer le serveur k3s
  hosts: all
  become: true
  pre_tasks:
    # Durcissement du socle : fail2ban (anti-brute-force SSH) + patchs OS auto.
    - name: Installer fail2ban et unattended-upgrades
      ansible.builtin.apt:
        name: [fail2ban, unattended-upgrades]
        state: present
        update_cache: true
      tags: [hardening]

    - name: Activer fail2ban
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started
      tags: [hardening]

    - name: Activer les mises à jour de sécurité automatiques
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      tags: [hardening]

    # Auth par mot de passe coupée, root par clé uniquement (la CI s'y connecte).
    - name: Durcir sshd (drop-in)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes
          X11Forwarding no
          MaxAuthTries 3
      notify: Redémarrer sshd
      tags: [hardening]
  handlers:
    - name: Redémarrer sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
  # Ordre = dépendances : observability avant istio (Kiali se branche sur son
  # Prometheus), istio avant argocd (la boutique a besoin des CRDs Istio).
  # Le rôle spire/ est conservé pour la démo v1 mais n'est plus joué.
  roles:
    - { role: k3s, tags: [k3s] }
    - { role: observability, tags: [observability] }
    - { role: istio, tags: [istio] }
    - { role: argocd, tags: [argocd] }
