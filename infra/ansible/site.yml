# Playbook principal : configure le serveur Hetzner vide créé par Terraform.
# Ordre : k3s (le cluster) -> SPIRE (l'identité) -> ArgoCD (le GitOps).
- name: Configurer le serveur k3s
  hosts: k3s
  become: true
  gather_facts: true
  roles:
    - role: k3s
      tags: [k3s]
    - role: spire
      tags: [spire]
    - role: argocd
      tags: [argocd]
