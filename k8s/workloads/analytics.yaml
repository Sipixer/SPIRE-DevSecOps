# Analytics : app Node.js. En v2, plus de sidecar Envoy maison ni de ConfigMap
# de 99 lignes : le sidecar Istio (injecté automatiquement via le label
# istio-injection du namespace) porte le mTLS et transmet l'identité du pair à
# l'app via l'en-tête X-Forwarded-Client-Cert. L'app écoute en clair sur :8080.
# L'identité Istio vient du ServiceAccount : spiffe://cluster.local/ns/shop/sa/analytics.
apiVersion: v1
kind: ServiceAccount
metadata: { name: analytics, namespace: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics, namespace: shop, labels: { app: analytics } }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics } }
  template:
    metadata: { labels: { app: analytics } }
    spec:
      serviceAccountName: analytics
      containers:
        - name: analytics
          image: ghcr.io/sipixer/spire-devsecops/analytics:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: analytics, namespace: shop }
spec:
  selector: { app: analytics }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
