# Analytics (Node.js) : sidecar Istio injecté, identité spiffe://.../sa/analytics.
apiVersion: v1
kind: ServiceAccount
metadata: { name: analytics, namespace: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics, namespace: shop, labels: { app: analytics } }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics } }
  template:
    metadata: { labels: { app: analytics } }
    spec:
      serviceAccountName: analytics
      containers:
        - name: analytics
          image: ghcr.io/sipixer/spire-devsecops/analytics:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: analytics, namespace: shop }
spec:
  selector: { app: analytics }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
