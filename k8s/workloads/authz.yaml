# Zero-trust déclaratif Istio : mTLS STRICT + autorisation par route/appelant.
# Dès qu'une AuthorizationPolicy ALLOW cible un workload, tout le reste est refusé
# (403 émis par le sidecar). Identités : spiffe://cluster.local/ns/shop/sa/<service>.
---
# mTLS STRICT sur tout le namespace : un appel non-mTLS est rejeté.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: shop
spec:
  mtls:
    mode: STRICT
---
# Exception Gateway : reçoit le navigateur via l'ingress Traefik (hors mesh), donc
# PERMISSIVE en entrée. Ses appels sortants restent en mTLS (STRICT côté destination).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: gateway-permissive
  namespace: shop
spec:
  selector:
    matchLabels: { app: gateway }
  mtls:
    mode: PERMISSIVE
---
# Payments : /pay réservé à Orders (scénario de refus de la démo), /_calls à la Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payments-authz
  namespace: shop
spec:
  selector:
    matchLabels: { app: payments }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/orders"]
      to:
        - operation:
            paths: ["/pay"]
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/gateway"]
      to:
        - operation:
            paths: ["/_calls"]
---
# Orders : /order et /_calls réservés à la Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-authz
  namespace: shop
spec:
  selector:
    matchLabels: { app: orders }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/gateway"]
      to:
        - operation:
            paths: ["/order", "/_calls"]
---
# Catalog : /products et /_calls réservés à la Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: catalog-authz
  namespace: shop
spec:
  selector:
    matchLabels: { app: catalog }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/gateway"]
      to:
        - operation:
            paths: ["/products", "/_calls"]
---
# Analytics : /event réservé à la Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: analytics-authz
  namespace: shop
spec:
  selector:
    matchLabels: { app: analytics }
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/shop/sa/gateway"]
      to:
        - operation:
            paths: ["/event"]
