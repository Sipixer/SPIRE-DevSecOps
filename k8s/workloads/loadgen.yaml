# Load generator : tape sur la Gateway en continu (comme un vrai client) pour
# animer Kiali/Grafana. Profil sur ~10 itérations : ~50% /api/products,
# ~30% /api/order, ~10% /api/event, ~10% /api/forbidden (403 zero-trust attendu).
apiVersion: v1
kind: ServiceAccount
metadata: { name: loadgen, namespace: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: shop, labels: { app: loadgen } }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      serviceAccountName: loadgen
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          env:
            - { name: GATEWAY, value: "http://gateway.shop.svc.cluster.local:8080" }
            - { name: SLEEP, value: "2" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "loadgen: trafic continu vers $GATEWAY (intervalle ${SLEEP}s)"
              i=0
              while true; do
                i=$((i + 1))
                r=$((i % 10))
                if [ "$r" -lt 5 ]; then
                  curl -fsS -o /dev/null --max-time 8 "$GATEWAY/api/products" || true
                elif [ "$r" -lt 8 ]; then
                  curl -fsS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/order" || true
                elif [ "$r" -lt 9 ]; then
                  curl -fsS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/event" || true
                else
                  # 403 attendu (zero-trust) : pas de -f sinon curl échouerait.
                  curl -sS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/forbidden" || true
                fi
                sleep "$SLEEP"
              done
