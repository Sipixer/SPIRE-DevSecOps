# Générateur de trafic ("load generator") : simule un client externe réaliste
# qui utilise la boutique en continu. Il tape sur la Gateway (le point d'entrée
# navigateur), exactement comme le ferait un vrai utilisateur — il n'appelle
# JAMAIS les services internes en direct. Ça garde le code applicatif 100% prod
# (aucune logique de démo dedans) tout en animant Kiali et Grafana en permanence.
#
# Il est dans le namespace shop, donc meshé : il apparaît dans Kiali comme la
# source du trafic (loadgen -> gateway -> orders/catalog/payments/analytics).
#
# Profil pondéré réaliste (sur ~10 itérations) :
#   ~50% /api/products  (browsing catalogue)
#   ~30% /api/order     (commande : gateway -> orders -> payments, mTLS)
#   ~10% /api/event     (analytics)
#   ~10% /api/forbidden (gateway -> /pay : REFUSÉ 403 par l'AuthorizationPolicy,
#                        garde le scénario zero-trust visible en rouge dans Kiali)
apiVersion: v1
kind: ServiceAccount
metadata: { name: loadgen, namespace: shop }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: shop, labels: { app: loadgen } }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      serviceAccountName: loadgen
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.0
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          env:
            # URL de la Gateway (point d'entrée client) et délai entre requêtes.
            - { name: GATEWAY, value: "http://gateway.shop.svc.cluster.local:8080" }
            - { name: SLEEP, value: "2" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "loadgen: trafic continu vers $GATEWAY (intervalle ${SLEEP}s)"
              i=0
              while true; do
                i=$((i + 1))
                r=$((i % 10))
                if [ "$r" -lt 5 ]; then
                  curl -fsS -o /dev/null --max-time 8 "$GATEWAY/api/products" || true
                elif [ "$r" -lt 8 ]; then
                  curl -fsS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/order" || true
                elif [ "$r" -lt 9 ]; then
                  curl -fsS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/event" || true
                else
                  # Scénario zero-trust : la Gateway tente /pay (réservé à Orders).
                  # Le mesh renvoie 403 ; -f ferait échouer curl, donc on l'omet ici.
                  curl -sS -o /dev/null --max-time 8 -X POST "$GATEWAY/api/forbidden" || true
                fi
                sleep "$SLEEP"
              done
