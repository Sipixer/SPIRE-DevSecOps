# Namespace boutique + les 4 services Go. Sidecar Istio injecté (label
# istio-injection). L'identité Istio dérive du ServiceAccount de chaque pod
# (spiffe://cluster.local/ns/shop/sa/<name>) ; les apps parlent HTTP clair sur :8080.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    istio-injection: enabled
---
# ServiceAccounts = identités Istio
apiVersion: v1
kind: ServiceAccount
metadata: { name: gateway, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: orders, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: catalog, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: payments, namespace: shop }
---
# Payments
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: shop, labels: { app: payments } }
spec:
  replicas: 1
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      serviceAccountName: payments
      containers:
        - name: payments
          image: ghcr.io/sipixer/spire-devsecops/payments:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: shop }
spec:
  selector: { app: payments }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Catalog
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: shop, labels: { app: catalog } }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: ghcr.io/sipixer/spire-devsecops/catalog:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: shop }
spec:
  selector: { app: catalog }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Orders (appelle Payments)
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: shop, labels: { app: orders } }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: ghcr.io/sipixer/spire-devsecops/orders:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PAYMENTS_URL, value: http://payments.shop.svc.cluster.local:8080/pay }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: shop }
spec:
  selector: { app: orders }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Gateway : porte d'entrée (HTTP navigateur, mTLS vers les services)
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: shop, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ghcr.io/sipixer/spire-devsecops/gateway:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ORDERS_URL, value: http://orders.shop.svc.cluster.local:8080 }
            - { name: CATALOG_URL, value: http://catalog.shop.svc.cluster.local:8080 }
            - { name: PAYMENTS_URL, value: http://payments.shop.svc.cluster.local:8080 }
            - { name: ANALYTICS_URL, value: http://analytics.shop.svc.cluster.local:8080 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: shop }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# Ingress Traefik (k3s) exposant la Gateway au navigateur.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: shop
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8080 }
