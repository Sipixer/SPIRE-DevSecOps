# Namespace de la boutique + les 4 services.
# Chaque service a son propre ServiceAccount : c'est lui qui détermine le
# SPIFFE ID attribué par SPIRE (spiffe://example.org/ns/shop/sa/<name>).
#
# Chaîne d'appels (tout en mTLS sauf le navigateur -> Gateway en HTTP) :
#   navigateur --HTTP--> gateway --mTLS--> orders --mTLS--> payments
#                        gateway --mTLS--> catalog
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
# --- ServiceAccounts (= identités SPIFFE) ---
apiVersion: v1
kind: ServiceAccount
metadata: { name: gateway, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: orders, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: catalog, namespace: shop }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: payments, namespace: shop }
---
# --- Payments : serveur mTLS, n'autorise qu'Orders ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: shop, labels: { app: payments } }
spec:
  replicas: 1
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      serviceAccountName: payments
      containers:
        - name: payments
          image: ghcr.io/sipixer/spire-devsecops/payments:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8443 }, { containerPort: 9100 }]
          env:
            - { name: SPIFFE_ENDPOINT_SOCKET, value: unix:///run/spire/sockets/spire-agent.sock }
            - { name: AUTHZ_DISABLED, value: "true" }
          volumeMounts:
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
      volumes:
        # Le SPIFFE CSI driver monte le socket du Workload API en lecture seule.
        - name: spire-agent-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: shop }
spec:
  selector: { app: payments }
  ports: [{ name: app, port: 8443, targetPort: 8443 }, { name: metrics, port: 9100, targetPort: 9100 }]
---
# --- Catalog : serveur mTLS, n'autorise que la Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: shop, labels: { app: catalog } }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: ghcr.io/sipixer/spire-devsecops/catalog:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8443 }, { containerPort: 9100 }]
          env:
            - { name: SPIFFE_ENDPOINT_SOCKET, value: unix:///run/spire/sockets/spire-agent.sock }
            - { name: AUTHZ_DISABLED, value: "true" }
          volumeMounts:
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
      volumes:
        - name: spire-agent-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: shop }
spec:
  selector: { app: catalog }
  ports: [{ name: app, port: 8443, targetPort: 8443 }, { name: metrics, port: 9100, targetPort: 9100 }]
---
# --- Orders : serveur mTLS (autorise Gateway) + client mTLS vers Payments ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: shop, labels: { app: orders } }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: ghcr.io/sipixer/spire-devsecops/orders:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8443 }, { containerPort: 9100 }]
          env:
            - { name: SPIFFE_ENDPOINT_SOCKET, value: unix:///run/spire/sockets/spire-agent.sock }
            - { name: AUTHZ_DISABLED, value: "true" }
            - { name: PAYMENTS_URL, value: https://payments.shop.svc.cluster.local:8443/pay }
          volumeMounts:
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
      volumes:
        - name: spire-agent-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: shop }
spec:
  selector: { app: orders }
  ports: [{ name: app, port: 8443, targetPort: 8443 }, { name: metrics, port: 9100, targetPort: 9100 }]
---
# --- Gateway : porte d'entrée. HTTP côté navigateur, mTLS vers Orders/Catalog ---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: shop, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ghcr.io/sipixer/spire-devsecops/gateway:latest
          imagePullPolicy: Always
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          ports: [{ containerPort: 8080 }, { containerPort: 9100 }]
          env:
            - { name: SPIFFE_ENDPOINT_SOCKET, value: unix:///run/spire/sockets/spire-agent.sock }
            - { name: AUTHZ_DISABLED, value: "true" }
            - { name: ORDERS_URL, value: https://orders.shop.svc.cluster.local:8443 }
            - { name: CATALOG_URL, value: https://catalog.shop.svc.cluster.local:8443 }
          volumeMounts:
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
      volumes:
        - name: spire-agent-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: shop }
spec:
  selector: { app: gateway }
  ports: [{ name: app, port: 8080, targetPort: 8080 }, { name: metrics, port: 9100, targetPort: 9100 }]
---
# Expose la Gateway au navigateur via l'ingress Traefik (inclus dans k3s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: shop
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8080 }
