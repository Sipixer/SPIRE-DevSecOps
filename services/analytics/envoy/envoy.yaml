# Envoy sidecar d'Analytics : termine le mTLS SPIFFE à la place de l'app Node.js.
#
# Récupère son SVID et le bundle du trust domain via SDS auprès du SPIRE Agent
# sous les noms de secret par défaut "default" et "ROOTCA". On ne demande PAS le
# SVID par son SPIFFE ID littéral : SPIRE renverrait alors "workload is not
# authorized for the requested identities". Les noms par défaut évitent ça.
node:
  id: analytics
  cluster: shop

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: mtls_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8443 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: analytics
                # Transmet l'URI SAN du pair à l'app via XFCC (non falsifiable).
                forward_client_cert_details: SANITIZE_SET
                set_current_client_cert_details:
                  uri: true
                route_config:
                  name: local
                  virtual_hosts:
                    - name: analytics
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: analytics_app }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc: { cluster_name: spire_agent }
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          prefix: "spiffe://example.org/"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc: { cluster_name: spire_agent }

  clusters:
    - name: spire_agent
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /run/spire/sockets/spire-agent.sock

    - name: analytics_app
      type: STATIC
      load_assignment:
        cluster_name: analytics_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9090 }
